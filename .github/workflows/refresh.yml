# Refresh the catalogue from the `dsh-plugin` topic.
#
# Runs on a schedule off the hour: GitHub queues scheduled workflows heavily at
# :00, and this job spends its whole budget on search and contents API calls
# that compete with everyone else's cron.
#
# The job only ever regenerates data and opens a commit on `main`. It does not
# install or execute any third-party code: every check here is static, reading
# `package.json` and the declared patch file through the contents API. Install
# verification, when added, must run in a separate workflow with its own
# isolation, because it executes untrusted postinstall scripts.
name: refresh

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gates run before the data is regenerated: if a predicate is broken, the
      # catalogue it would produce is not trustworthy, and publishing it would
      # be worse than republishing yesterday's.
      - name: Verify contract gates reject invalid input
        run: node scripts/test-gates.mjs

      # Both of these decide published verdicts: monorepo discovery decides
      # whether 104 subpackage plugins are seen at all, and the partial-evidence
      # rule decides whether an unread tree is published as "no bundle". Neither
      # may regress silently.
      - name: Verify monorepo bundle discovery
        run: node scripts/test-monorepo.mjs

      - name: Verify partial evidence yields no verdict
        run: node scripts/test-inconclusive.mjs

      - name: Verify decay never reports doubt as decay
        run: node scripts/test-decay.mjs

      - name: Verify attribution refuses to publish a broken fetch
        run: node scripts/test-attribution.mjs

      - name: Verify the probe queue never orders work by stars
        run: node scripts/test-queue.mjs

      # An exhausted search allowance fails every shard identically, so a
      # fragment of the topic comes out shaped like a deliberate sample.
      - name: Verify enumeration refuses a fragment of the topic
        run: node scripts/test-enumerate.mjs

      # The review run itself needs model credentials and does not execute here.
      # These controls drive the reviewer against a stub model and a stub `gh`,
      # so they check the guarantees that do not depend on a live model: a failed
      # review never becomes a score, out-of-range scores are rejected, reuse is
      # keyed on commit SHA and prompt version, and sampling is star-neutral.
      - name: Verify the quality reviewer never publishes a failure as a score
        run: node scripts/test-review.mjs

      # Every figure in both READMEs is generated from data/. They used to be typed
      # by hand while a scheduled workflow regenerated the data, so they could only
      # drift: measured once at 6929/1698/1167 published against 7111/2398/1660 in
      # the data. This gate makes that state unmergeable.
      - name: Verify the published figures match the data
        run: node scripts/test-render-readme.mjs

      - name: Verify the published-manifest check never reports a read failure as a defect
        run: node scripts/test-npm-manifest.mjs

      - name: Verify the checkout fetcher rejects incomplete transfers
        run: ./scripts/test-fetch.sh

      # The conformance auditor does NOT build the catalogue; see
      # AUDIT-EXPERIMENTAL.md. Its fixture suite runs here regardless, so a
      # regression surfaces while the auditor is still experimental rather than
      # at the moment someone decides to publish its verdicts.
      #
      # A fixture whose checkout could not be fetched fails the job instead of
      # being skipped: an audit run over an incomplete tree produces confident
      # false findings, which is the exact failure this suite exists to prevent.
      - name: Verify the experimental auditor against labelled fixtures
        run: |
          root=$(mktemp -d)
          while read -r repo; do
            [ -n "$repo" ] || continue
            set +e
            ./scripts/fetch-checkout.sh "$repo" "$root/$(echo "$repo" | tr '/' '_')" package.json
            code=$?
            set -e
            if [ "$code" -eq 1 ]; then
              echo "fixture fetch failed for ${repo}; audit results would not be valid" >&2
              exit 1
            fi
          done < <(node -e "
            const { readFileSync } = require('node:fs')
            const spec = JSON.parse(readFileSync('fixtures/labelled.json', 'utf8'))
            // Each name needs its own trailing newline: joining with '\n' omits
            // one after the last entry, and 'while read' discards that final
            // unterminated line. Measured — it silently dropped the last
            // fixture, which then reported as skipped rather than failing.
            process.stdout.write(spec.fixtures.map((f) => f.repo + '\n').join(''))
          ")
          node scripts/test-audit.mjs "$root"

      # A full refresh issues on the order of a thousand API calls: one to two
      # per repository in the probe, one per compliant plugin in attribution,
      # and two per entry in the decay scan. GITHUB_TOKEN's allowance is per
      # repository per hour, so a second run inside the same hour starts with a
      # depleted budget and every tree read fails.
      #
      # Measured: a run 25 minutes after a successful one returned
      # TREE_UNREADABLE for all 998 repositories. The probe now refuses that
      # output rather than publishing it, but failing before spending what is
      # left is better than failing after.
      #
      # `core` and `search` are separate pools and both are load-bearing here:
      # enumeration spends `search` (30 per minute), while probing and
      # attribution spend `core`. Checking only `core` let run 32097129800 pass
      # this step and then fail enumeration with "API rate limit exceeded".
      #
      # A per-minute pool cannot be secured by one reading, though: run
      # 32097808000 saw search 30/30 here and was still refused, because planning
      # alone burst about 24 queries before the shard loop began. The enumerator
      # now paces its own calls to stay inside the rate, so this check is only a
      # guard against starting with an already-depleted window.
      - name: Check the API allowance before spending it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          limits=$(gh api rate_limit)
          core=$(printf '%s' "${limits}" | jq -r '.resources.core.remaining')
          core_reset=$(printf '%s' "${limits}" | jq -r '.resources.core.reset')
          search=$(printf '%s' "${limits}" | jq -r '.resources.search.remaining')
          search_reset=$(printf '%s' "${limits}" | jq -r '.resources.search.reset')
          echo "core allowance reported:    ${core}"
          echo "search allowance remaining: ${search}"

          # `rate_limit` does not report the pool that governs these calls. Run
          # 32222507092 read `core: 5000` here and, ten minutes later, every one
          # of 700 tree reads failed with "API rate limit exceeded for
          # installation" — a different bucket from the `core` this endpoint
          # describes. A threshold on `core` therefore cannot fire, and reading it
          # gave false confidence rather than a check.
          #
          # The only reliable signal is a request against the same pool, so make
          # one and read its outcome. It costs a single call.
          probe_status=$(gh api repos/${GITHUB_REPOSITORY}/git/trees/HEAD \
            --jq '.sha' >/dev/null 2>/tmp/probe.err && echo ok || echo failed)
          if [ "${probe_status}" != "ok" ]; then
            if grep -qi 'rate limit' /tmp/probe.err; then
              echo "::error::the installation allowance is exhausted: a single tree read was rejected. Re-run in the next window."
              sed 's/^/  /' /tmp/probe.err
              exit 1
            fi
            echo "::error::a probe request failed for a reason other than rate limiting:"
            sed 's/^/  /' /tmp/probe.err
            exit 1
          fi
          echo "installation allowance: a tree read succeeded"

          # Keep the reported figure as a secondary signal: when it does drop it
          # still means something, even though it cannot be relied on alone.
          if [ "${core}" -lt 500 ]; then
            wait_min=$(( (core_reset - $(date +%s) + 59) / 60 ))
            echo "::error::the reported core allowance is down to ${core}; it resets in about ${wait_min} minute(s)."
            exit 1
          fi
          # The enumerator paces itself, so it only needs the window to be
          # substantially open at the start rather than to hold every query.
          if [ "${search}" -lt 10 ]; then
            wait_sec=$(( search_reset - $(date +%s) ))
            [ "${wait_sec}" -lt 0 ] && wait_sec=0
            echo "::error::only ${search} search calls left; the paced enumeration needs an open window. The search allowance resets in about ${wait_sec} second(s)."
            exit 1
          fi

      # Enumerate by sharding around the search API's 1000-result cap. A single
      # query reports 6081 repositories and returns 1000, so the census covered
      # 16.4% of the topic while claiming to measure it — and that 16.4% was the
      # most-recently-updated slice, which excludes dormant repositories by
      # construction. Sharding by star bucket, then by creation date where a
      # bucket still exceeds the cap, reached 96.5% when measured.
      - name: Enumerate the whole topic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/enumerate-topic.mjs > /tmp/enumerated.jsonl
          mv /tmp/enumerated.jsonl data/repos-raw.jsonl
          wc -l data/repos-raw.jsonl

      # Probing every enumerated repository costs more API calls than one hourly
      # allowance provides, so verdicts accumulate across runs instead of being
      # recomputed. The queue takes never-probed repositories first, oldest
      # enumeration first — deliberately not by stars, which is the ordering that
      # left the quiet majority of the topic unexamined to begin with.
      - name: Probe the bundle contract for a batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '6'
          CENSUS_BATCH: '700'
        run: |
          node scripts/probe-queue.mjs --stats
          node scripts/probe-queue.mjs --limit "${CENSUS_BATCH}" > /tmp/batch.txt
          if [ ! -s /tmp/batch.txt ]; then
            echo "every enumerated repository has a fresh verdict; nothing to probe"
          else
            node scripts/probe-contract.mjs < /tmp/batch.txt > /tmp/batch-verdicts.jsonl
            node -e '
              const fs = require("node:fs")
              const load = (p) => fs.existsSync(p)
                ? fs.readFileSync(p, "utf8").split("\n").filter((l) => l.trim()).map((l) => JSON.parse(l))
                : []
              const merged = new Map(load("data/contract-v3.jsonl").map((r) => [r.repo, r]))
              for (const r of load("/tmp/batch-verdicts.jsonl")) merged.set(r.repo, r)
              fs.writeFileSync("data/contract-v3.jsonl",
                [...merged.values()].map((r) => JSON.stringify(r)).join("\n") + "\n")
              process.stderr.write(`verdicts on file: ${merged.size}\n`)
            '
          fi
          jq -r '.verdict' data/contract-v3.jsonl | sort | uniq -c | sort -rn

      - name: Attribute plugin surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '6'
        run: |
          # Reuses existing high/medium attributions so the step costs one call
          # per newly compliant plugin rather than one per plugin in the whole
          # catalogue. Writes via a temp file: reading and writing the same path
          # in one pipeline would truncate the reuse source before it is read.
          node scripts/attribute.mjs --existing data/surface-v3.jsonl \
            < data/contract-v3.jsonl > /tmp/surface-next.jsonl
          mv /tmp/surface-next.jsonl data/surface-v3.jsonl
          jq -r '"\(.surface) \(.confidence)"' data/surface-v3.jsonl | sort | uniq -c | sort -rn

      - name: Assess installability
        env:
          RADAR_CONCURRENCY: '6'
        run: |
          node scripts/installability.mjs < data/contract-v3.jsonl > data/installability-v3.jsonl
          jq -r '.installable' data/installability-v3.jsonl | sort | uniq -c | sort -rn

      - name: Join and render
        run: |
          jq -s 'unique_by(.repo)' data/surface-v3.jsonl > /tmp/surf.json
          jq -s 'unique_by(.repo)' data/installability-v3.jsonl > /tmp/inst.json
          jq -s 'unique_by(.full_name)' data/repos-raw.jsonl > /tmp/raw.json
          jq -s -c --slurpfile S /tmp/surf.json --slurpfile I /tmp/inst.json --slurpfile R /tmp/raw.json '
            ($S[0] | map({key:.repo, value:.}) | from_entries) as $s
            | ($I[0] | map({key:.repo, value:.}) | from_entries) as $i
            | ($R[0] | map({key:.full_name, value:.}) | from_entries) as $r
            | map(select(.verdict=="CONTRACT_OK") | {
                repo, package: .name, manifestPath,
                surface: ($s[.repo].surface // "unknown"),
                confidence: ($s[.repo].confidence // "none"),
                evidence: ($s[.repo].evidence // []),
                installable: ($i[.repo].installable // "unknown"),
                installReason: ($i[.repo].reason // null),
                stars: ($r[.repo].stars // 0),
                description: ($r[.repo].desc // null),
                pushed: ($r[.repo].pushed_at // null)})
            | sort_by([(if .installable=="published" then 0 elif .installable=="git-only" then 1 else 2 end),
                       (if .confidence=="high" then 0 elif .confidence=="declared" then 1
                        elif .confidence=="medium" then 2 elif .confidence=="low" then 3
                        else 4 end), -.stars])
            | .[]' data/contract-v3.jsonl > data/catalog.jsonl
          node scripts/render.mjs

      # Decay runs after the catalogue is rebuilt, over the entries just
      # published. Findings are recorded for review and never remove an entry,
      # but the step is NOT continue-on-error: the scan refuses to publish when
      # most entries could not be checked, and swallowing that exit would put the
      # meaningless scan back into the commit it was written to prevent.
      # The scan is incremental. Re-checking every entry cost two API calls per
      # catalogue entry and grew with the catalogue — 85% of the hourly allowance
      # at 2117 entries — which is what made the 2026-08-19 scheduled run fail at
      # 45.4% inconclusive. Each run checks a bounded batch, oldest first, and
      # carries the rest forward.
      # The contract probe reads a repository's package.json; a user installs the
      # published tarball. They disagree: 75 of 1296 published packages declare no
      # `dsh.bundle` even though their repository does, so DSH refuses them as
      # profile bundles with "declares no dsh.bundle" — verified against
      # @deepseek-ai/dsh@0.1.0-rc.7. This runs against the npm registry, so it does
      # not compete with the probe for GitHub's installation allowance.
      - name: Check what the published packages declare
        env:
          CENSUS_NPM_BATCH: '600'
        run: |
          node scripts/probe-npm-manifest.mjs --existing data/npm-manifest.jsonl \
            < data/catalog.jsonl > /tmp/npm-manifest.jsonl
          mv /tmp/npm-manifest.jsonl data/npm-manifest.jsonl

      - name: Scan the catalogue for decay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '10'
          CENSUS_DECAY_BATCH: '800'
        run: |
          node scripts/scan-decay.mjs --existing data/decay.jsonl \
            < data/catalog.jsonl > /tmp/decay.jsonl
          mv /tmp/decay.jsonl data/decay.jsonl
          jq -r '.state' data/decay.jsonl | sort | uniq -c | sort -rn

      # A refresh that produces an empty catalogue means the search or probe
      # step failed without a non-zero exit, so it must not be committed over
      # a good one.
      - name: Guard against an empty catalogue
        run: |
          count=$(wc -l < data/catalog.jsonl)
          echo "catalogue entries: ${count}"
          if [ "${count}" -lt 100 ]; then
            echo "refusing to publish a catalogue with ${count} entries" >&2
            exit 1
          fi

      # Quality review runs after the catalogue is known good, and deliberately
      # cannot fail the job: the census is decidable evidence, the review is a
      # model's opinion, and a model outage must not stop the former from
      # publishing. `continue-on-error` keeps a failed review out of the data
      # while leaving the run green — the reviewer itself already refuses to
      # publish a score it did not obtain.
      #
      # The seed changes every run, so draws overlap partially: new entries widen
      # coverage and re-drawn entries accumulate a second sample to average.
      # Skipped entirely when no key is configured, so a fork without the secret
      # still gets a full census.
      - name: Review catalogued plugins with a model
        id: review
        continue-on-error: true
        env:
          # The reviewer reads each repository's head commit, README and tree
          # through `gh api`, so it needs the same token as every other step.
          # Without it every review failed as HEAD_UNREADABLE in 0.7 seconds,
          # which looked like a model problem and was an auth problem.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CENSUS_API_BASE: ${{ vars.CENSUS_API_BASE }}
          CENSUS_API_MODEL: ${{ vars.CENSUS_API_MODEL }}
          # Upper bound on reviews per run. The effective batch is the smaller of
          # this and what the remaining core allowance affords, and the reviewer
          # also stops at the wall-clock deadline below.
          #
          # Reviews now run in a pool, measured at 4.83 s each against the live
          # endpoint rather than 17.6 s sequentially. Both constraints land near
          # the same place: 15 minutes affords ~186 reviews, and the allowance left
          # after the census work affords a similar number at 3 calls each. The cap
          # sits just under that, and the deadline enforces it if a run is slower
          # than measured. The budget is computed from a fresh `rate_limit` read in
          # the step body, so a depleted allowance shrinks the batch automatically.
          CENSUS_REVIEW_MAX: '180'
          CENSUS_REVIEW_DEADLINE_SECONDS: '900'
          # Bounded pool. Kept below what the endpoint tolerated (24 concurrent
          # calls returned 200 with no latency change) because the `gh` fetches
          # share GitHub's allowance with the probe, and a burst risks secondary
          # rate limiting that no per-hour figure predicts.
          CENSUS_REVIEW_CONCURRENCY: '4'
        run: |
          # The `secrets` context is not available in a step-level `if`, so the
          # skip is decided here instead. Using `if: secrets.X != ''` would make
          # this step skip unconditionally and silently.
          if [ -z "${CENSUS_API_KEY}" ]; then
            echo "no CENSUS_API_KEY configured; skipping the model review"
            exit 0
          fi
          # Size the batch from the allowance actually left, not a fixed guess.
          # Measured: 3 core calls per review (head commit, README, tree; the
          # manifest read is served from the same tree request often enough that
          # the average is 3.0 over a sample of fresh reviews). The steps before
          # this one spend most of the hourly 5000, and the catalogue keeps
          # growing, so a hardcoded limit either wastes headroom or overruns it.
          remaining=$(gh api rate_limit --jq '.resources.core.remaining')
          reserve=200
          budget=$(( (remaining - reserve) / 3 ))
          limit="${CENSUS_REVIEW_MAX}"
          if [ "${budget}" -lt "${limit}" ]; then limit="${budget}"; fi
          echo "core remaining: ${remaining}; review limit: ${limit} (cap ${CENSUS_REVIEW_MAX})"
          if [ "${limit}" -lt 1 ]; then
            echo "::warning::not enough core allowance left to review anything this run"
            exit 0
          fi
          seed=$(date -u +%Y%m%d%H)
          echo "review seed: ${seed}"
          if node scripts/ai-review.mjs --limit "${limit}" --seed "${seed}" \
              --existing data/reviews.jsonl \
              < data/catalog.jsonl > /tmp/reviews.jsonl; then
            mv /tmp/reviews.jsonl data/reviews.jsonl
            echo "reviews: $(wc -l < data/reviews.jsonl)"
          else
            echo "::warning::review run refused its own output; data/reviews.jsonl left unchanged"
          fi

      # Rewrite the figures from the data just produced. Without this the commit
      # below would publish a fresh catalogue beside stale prose.
      - name: Regenerate the published figures
        run: |
          node scripts/render-readme.mjs
          node scripts/render-readme.mjs --check

      - name: Commit regenerated catalogue
        run: |
          if git diff --quiet; then
            echo "catalogue is already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ PLUGINS.md README.md README.zh.md
          git commit -m 'Refresh the contract-verified plugin catalogue'
          git push
