# Refresh the catalogue from the `dsh-plugin` topic.
#
# Runs on a schedule off the hour: GitHub queues scheduled workflows heavily at
# :00, and this job spends its whole budget on search and contents API calls
# that compete with everyone else's cron.
#
# The job only ever regenerates data and opens a commit on `main`. It does not
# install or execute any third-party code: every check here is static, reading
# `package.json` and the declared patch file through the contents API. Install
# verification, when added, must run in a separate workflow with its own
# isolation, because it executes untrusted postinstall scripts.
name: refresh

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gates run before the data is regenerated: if a predicate is broken, the
      # catalogue it would produce is not trustworthy, and publishing it would
      # be worse than republishing yesterday's.
      - name: Verify contract gates reject invalid input
        run: node scripts/test-gates.mjs

      # Both of these decide published verdicts: monorepo discovery decides
      # whether 104 subpackage plugins are seen at all, and the partial-evidence
      # rule decides whether an unread tree is published as "no bundle". Neither
      # may regress silently.
      - name: Verify monorepo bundle discovery
        run: node scripts/test-monorepo.mjs

      - name: Verify partial evidence yields no verdict
        run: node scripts/test-inconclusive.mjs

      - name: Verify decay never reports doubt as decay
        run: node scripts/test-decay.mjs

      - name: Verify attribution refuses to publish a broken fetch
        run: node scripts/test-attribution.mjs

      - name: Verify the probe queue never orders work by stars
        run: node scripts/test-queue.mjs

      # The review run itself needs model credentials and does not execute here.
      # These controls drive the reviewer against a stub model and a stub `gh`,
      # so they check the guarantees that do not depend on a live model: a failed
      # review never becomes a score, out-of-range scores are rejected, reuse is
      # keyed on commit SHA and prompt version, and sampling is star-neutral.
      - name: Verify the quality reviewer never publishes a failure as a score
        run: node scripts/test-review.mjs

      - name: Verify the checkout fetcher rejects incomplete transfers
        run: ./scripts/test-fetch.sh

      # The conformance auditor does NOT build the catalogue; see
      # AUDIT-EXPERIMENTAL.md. Its fixture suite runs here regardless, so a
      # regression surfaces while the auditor is still experimental rather than
      # at the moment someone decides to publish its verdicts.
      #
      # A fixture whose checkout could not be fetched fails the job instead of
      # being skipped: an audit run over an incomplete tree produces confident
      # false findings, which is the exact failure this suite exists to prevent.
      - name: Verify the experimental auditor against labelled fixtures
        run: |
          root=$(mktemp -d)
          while read -r repo; do
            [ -n "$repo" ] || continue
            set +e
            ./scripts/fetch-checkout.sh "$repo" "$root/$(echo "$repo" | tr '/' '_')" package.json
            code=$?
            set -e
            if [ "$code" -eq 1 ]; then
              echo "fixture fetch failed for ${repo}; audit results would not be valid" >&2
              exit 1
            fi
          done < <(node -e "
            const { readFileSync } = require('node:fs')
            const spec = JSON.parse(readFileSync('fixtures/labelled.json', 'utf8'))
            // Each name needs its own trailing newline: joining with '\n' omits
            // one after the last entry, and 'while read' discards that final
            // unterminated line. Measured — it silently dropped the last
            // fixture, which then reported as skipped rather than failing.
            process.stdout.write(spec.fixtures.map((f) => f.repo + '\n').join(''))
          ")
          node scripts/test-audit.mjs "$root"

      # A full refresh issues on the order of a thousand API calls: one to two
      # per repository in the probe, one per compliant plugin in attribution,
      # and two per entry in the decay scan. GITHUB_TOKEN's allowance is per
      # repository per hour, so a second run inside the same hour starts with a
      # depleted budget and every tree read fails.
      #
      # Measured: a run 25 minutes after a successful one returned
      # TREE_UNREADABLE for all 998 repositories. The probe now refuses that
      # output rather than publishing it, but failing before spending what is
      # left is better than failing after.
      - name: Check the API allowance before spending it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remaining=$(gh api rate_limit --jq '.resources.core.remaining')
          reset=$(gh api rate_limit --jq '.resources.core.reset')
          echo "core allowance remaining: ${remaining}"
          if [ "${remaining}" -lt 2500 ]; then
            wait_min=$(( (reset - $(date +%s) + 59) / 60 ))
            echo "::error::only ${remaining} core calls left; a full refresh needs roughly 2500. The allowance resets in about ${wait_min} minute(s)."
            exit 1
          fi

      # Enumerate by sharding around the search API's 1000-result cap. A single
      # query reports 6081 repositories and returns 1000, so the census covered
      # 16.4% of the topic while claiming to measure it — and that 16.4% was the
      # most-recently-updated slice, which excludes dormant repositories by
      # construction. Sharding by star bucket, then by creation date where a
      # bucket still exceeds the cap, reached 96.5% when measured.
      - name: Enumerate the whole topic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/enumerate-topic.mjs > /tmp/enumerated.jsonl
          mv /tmp/enumerated.jsonl data/repos-raw.jsonl
          wc -l data/repos-raw.jsonl

      # Probing every enumerated repository costs more API calls than one hourly
      # allowance provides, so verdicts accumulate across runs instead of being
      # recomputed. The queue takes never-probed repositories first, oldest
      # enumeration first — deliberately not by stars, which is the ordering that
      # left the quiet majority of the topic unexamined to begin with.
      - name: Probe the bundle contract for a batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '6'
          CENSUS_BATCH: '700'
        run: |
          node scripts/probe-queue.mjs --stats
          node scripts/probe-queue.mjs --limit "${CENSUS_BATCH}" > /tmp/batch.txt
          if [ ! -s /tmp/batch.txt ]; then
            echo "every enumerated repository has a fresh verdict; nothing to probe"
          else
            node scripts/probe-contract.mjs < /tmp/batch.txt > /tmp/batch-verdicts.jsonl
            node -e '
              const fs = require("node:fs")
              const load = (p) => fs.existsSync(p)
                ? fs.readFileSync(p, "utf8").split("\n").filter((l) => l.trim()).map((l) => JSON.parse(l))
                : []
              const merged = new Map(load("data/contract-v3.jsonl").map((r) => [r.repo, r]))
              for (const r of load("/tmp/batch-verdicts.jsonl")) merged.set(r.repo, r)
              fs.writeFileSync("data/contract-v3.jsonl",
                [...merged.values()].map((r) => JSON.stringify(r)).join("\n") + "\n")
              process.stderr.write(`verdicts on file: ${merged.size}\n`)
            '
          fi
          jq -r '.verdict' data/contract-v3.jsonl | sort | uniq -c | sort -rn

      - name: Attribute plugin surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '6'
        run: |
          # Reuses existing high/medium attributions so the step costs one call
          # per newly compliant plugin rather than one per plugin in the whole
          # catalogue. Writes via a temp file: reading and writing the same path
          # in one pipeline would truncate the reuse source before it is read.
          node scripts/attribute.mjs --existing data/surface-v3.jsonl \
            < data/contract-v3.jsonl > /tmp/surface-next.jsonl
          mv /tmp/surface-next.jsonl data/surface-v3.jsonl
          jq -r '"\(.surface) \(.confidence)"' data/surface-v3.jsonl | sort | uniq -c | sort -rn

      - name: Assess installability
        env:
          RADAR_CONCURRENCY: '6'
        run: |
          node scripts/installability.mjs < data/contract-v3.jsonl > data/installability-v3.jsonl
          jq -r '.installable' data/installability-v3.jsonl | sort | uniq -c | sort -rn

      - name: Join and render
        run: |
          jq -s 'unique_by(.repo)' data/surface-v3.jsonl > /tmp/surf.json
          jq -s 'unique_by(.repo)' data/installability-v3.jsonl > /tmp/inst.json
          jq -s 'unique_by(.full_name)' data/repos-raw.jsonl > /tmp/raw.json
          jq -s -c --slurpfile S /tmp/surf.json --slurpfile I /tmp/inst.json --slurpfile R /tmp/raw.json '
            ($S[0] | map({key:.repo, value:.}) | from_entries) as $s
            | ($I[0] | map({key:.repo, value:.}) | from_entries) as $i
            | ($R[0] | map({key:.full_name, value:.}) | from_entries) as $r
            | map(select(.verdict=="CONTRACT_OK") | {
                repo, package: .name, manifestPath,
                surface: ($s[.repo].surface // "unknown"),
                confidence: ($s[.repo].confidence // "none"),
                evidence: ($s[.repo].evidence // []),
                installable: ($i[.repo].installable // "unknown"),
                installReason: ($i[.repo].reason // null),
                stars: ($r[.repo].stars // 0),
                description: ($r[.repo].desc // null),
                pushed: ($r[.repo].pushed_at // null)})
            | sort_by([(if .installable=="published" then 0 elif .installable=="git-only" then 1 else 2 end),
                       (if .confidence=="high" then 0 elif .confidence=="medium" then 1
                        elif .confidence=="low" then 2 else 3 end), -.stars])
            | .[]' data/contract-v3.jsonl > data/catalog.jsonl
          node scripts/render.mjs

      # Decay runs after the catalogue is rebuilt, over the entries just
      # published. Findings are recorded for review and never remove an entry,
      # but the step is NOT continue-on-error: the scan refuses to publish when
      # most entries could not be checked, and swallowing that exit would put the
      # meaningless scan back into the commit it was written to prevent.
      - name: Scan the catalogue for decay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_CONCURRENCY: '10'
        run: |
          node scripts/scan-decay.mjs < data/catalog.jsonl > data/decay.jsonl
          jq -r '.state' data/decay.jsonl | sort | uniq -c | sort -rn

      # A refresh that produces an empty catalogue means the search or probe
      # step failed without a non-zero exit, so it must not be committed over
      # a good one.
      - name: Guard against an empty catalogue
        run: |
          count=$(wc -l < data/catalog.jsonl)
          echo "catalogue entries: ${count}"
          if [ "${count}" -lt 100 ]; then
            echo "refusing to publish a catalogue with ${count} entries" >&2
            exit 1
          fi

      - name: Commit regenerated catalogue
        run: |
          if git diff --quiet; then
            echo "catalogue is already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ PLUGINS.md README.md README.zh.md
          git commit -m 'Refresh the contract-verified plugin catalogue'
          git push
